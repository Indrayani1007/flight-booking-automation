name: BlazeDemo Regression Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  regression-tests:
    name: Run Regression Tests (Chrome Headless)
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: blazedemo_regression_suite/requirements.txt

      # ── Chrome setup (ubuntu-latest ships with Chrome) ────────────────────
      - name: Install Google Chrome
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            google-chrome-stable \
            fonts-liberation \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libgbm1 libgtk-3-0 libxcomposite1 libxdamage1 libxrandr2 \
            xdg-utils
          google-chrome --version

      # ── Dependencies ──────────────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r blazedemo_regression_suite/requirements.txt

      # ── Ensure reports directory exists ───────────────────────────────────
      - name: Create reports directories
        run: mkdir -p blazedemo_regression_suite/reports/screenshots

      # ── Run test suite ────────────────────────────────────────────────────
      - name: Execute regression suite (headless Chrome)
        working-directory: blazedemo_regression_suite
        env:
          # Force headless even if --headless flag is not passed
          CI: "true"
        run: |
          python -m pytest tests/ \
            -v \
            --browser=chrome \
            --headless \
            --html=reports/report.html \
            --self-contained-html \
            --timeout=120 \
            -ra \
            --tb=short \
            2>&1 | tee reports/ci_output.log
        continue-on-error: true  # Upload artifacts even on failure

      # ── Upload test artifacts ─────────────────────────────────────────────
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blazedemo-test-report-${{ github.run_number }}
          path: |
            blazedemo_regression_suite/reports/report.html
            blazedemo_regression_suite/reports/test_run.log
            blazedemo_regression_suite/reports/ci_output.log
            blazedemo_regression_suite/reports/screenshots/
          retention-days: 14

      # ── Fail the job if tests failed ──────────────────────────────────────
      - name: Check test results
        working-directory: blazedemo_regression_suite
        run: |
          python -m pytest tests/ \
            --browser=chrome \
            --headless \
            --timeout=120 \
            -q \
            --no-header
