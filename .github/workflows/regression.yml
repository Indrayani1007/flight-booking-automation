name: SkyBook Regression Suite — CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    name: Cross-Browser Regression Tests
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. Install Allure CLI ─────────────────────────────────────────────
      - name: Install Allure CLI
        run: |
          curl -o allure.tgz -L https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -xzf allure.tgz -C /opt
          echo "/opt/allure-2.27.0/bin" >> $GITHUB_PATH

      # ── 4. Install Python dependencies ───────────────────────────────────
      - name: Install dependencies
        working-directory: blazedemo_regression_suite
        run: pip install -r requirements.txt

      # ── 5. Start local SkyBook web app ───────────────────────────────────
      - name: Start SkyBook web server
        run: python run_app.py &
        # The & backgrounds the server; give it a moment to start
      - name: Wait for web server to be ready
        run: sleep 2

      # ── 6. Run Pytest suite (headless Chrome) ────────────────────────────
      - name: Run regression tests
        working-directory: blazedemo_regression_suite
        run: |
          pytest --headless \
                 --html=reports/report.html \
                 --self-contained-html \
                 --alluredir=allure-results \
                 -v --tb=short
        continue-on-error: true  # Upload artifacts even if tests fail

      # ── 7. Generate Allure HTML report ───────────────────────────────────
      - name: Generate Allure HTML report
        working-directory: blazedemo_regression_suite
        run: allure generate allure-results --clean -o allure-report

      # ── 8. Upload test artifacts ──────────────────────────────────────────
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report
          path: blazedemo_regression_suite/reports/

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: blazedemo_regression_suite/allure-report/

      - name: Upload Allure results (raw)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: blazedemo_regression_suite/allure-results/
