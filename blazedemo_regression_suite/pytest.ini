[pytest]
# ── Test discovery ─────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ────────────────────────────────────────────────────────────────
markers =
    smoke:      Quick sanity checks — run first in CI pipelines
    regression: Full regression suite markers
    e2e:        End-to-end workflow tests
    negative:   Boundary & error-condition tests

# ── Timeout ────────────────────────────────────────────────────────────────
timeout = 120

# ── Logging ────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %H:%M:%S

log_file = reports/test_run.log
log_file_level = DEBUG
log_file_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# ── Output ─────────────────────────────────────────────────────────────────
addopts =
    --tb=short
    --strict-markers
    -ra
