[pytest]
# SkyBook Regression Suite — Pytest Configuration

# ── Test discovery ────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Marker definitions ────────────────────────────────────────────────────────
# Custom markers group tests so subsets can be run selectively.
# Example: pytest -m smoke  (runs only smoke tests)
markers =
    smoke:      Fast sanity checks run on every code change.
    regression: Full regression tests run before every release.
    e2e:        End-to-end transaction tests covering the full booking funnel.
    negative:   Boundary and error-path tests for invalid inputs.

# ── Default command-line options ──────────────────────────────────────────────
# --headless:           run Chrome without a visible window (CI-safe)
# --html / --self-contained-html: generate a portable single-file HTML report
# --alluredir:          output Allure result JSON to allure-results/
# -v:                   verbose output (one test per line)
addopts =
    --headless
    --html=reports/report.html
    --self-contained-html
    --alluredir=allure-results
    -v
    --tb=short

# ── Logging ───────────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_file = reports/test_run.log
log_file_level = DEBUG
log_format = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

# ── Timeouts ─────────────────────────────────────────────────────────────────
# Global per-test timeout (seconds) — prevents hanging tests from blocking CI
timeout = 120
